name: oee-service CI

on:
  push:
    branches: [main]
    paths:
      - "services/oee-service/**"
      - ".github/workflows/oee-service-ci.yml"
  pull_request:
    paths:
      - "services/oee-service/**"
      - ".github/workflows/oee-service-ci.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # ubuntu-latest 러너는 Docker가 기본 내장되어 있어 Testcontainers(Postgres + Mosquitto)가
    # 별도 설정 없이 동작한다 — 로컬 Windows/Docker Desktop 환경과 달리 이게 표준 케이스다.
    defaults:
      run:
        working-directory: services/oee-service

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Run gradlew
        run: chmod +x gradlew

      - name: Build and test (unit + Testcontainers integration)
        run: ./gradlew build

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oee-service-test-report
          path: services/oee-service/build/reports/tests/test
          retention-days: 7
